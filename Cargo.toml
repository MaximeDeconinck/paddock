[workspace]
resolver = "3"
members = ["crates/paddock-core", "crates/paddock"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/MaximeDeconinck/paddock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.39", features = ["bundled"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "MaximeDeconinck/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Build (but don't publish) artifacts on pull requests, to catch build breakage early
pr-run-mode = "upload"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
